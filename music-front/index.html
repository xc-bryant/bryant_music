<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="./css/index.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <span>音乐播放器</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-section="songs">
                    <i class="fas fa-list"></i>
                    <span>歌曲列表</span>
                </a>
                <a href="#" class="nav-item" data-section="search">
                    <i class="fas fa-search"></i>
                    <span>搜索</span>
                </a>
                <a href="#" class="nav-item" data-section="upload">
                    <i class="fas fa-upload"></i>
                    <span>上传歌曲</span>
                </a>
                <a href="#" class="nav-item" data-section="favorites">
                    <i class="fas fa-heart"></i>
                    <span>收藏</span>
                </a>
            </nav>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部搜索栏 -->
            <div class="top-bar">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="搜索歌曲、艺术家或专辑...">
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                </div>
            </div>

            <!-- 内容区域 -->
            <div class="content-area">
                <!-- 歌曲列表页面 -->
                <div id="songs-section" class="section active">
                    <div class="section-header">
                        <h2>歌曲列表</h2>
                        <div class="section-actions">
                            <button class="btn btn-primary" id="refreshSongs">
                                <i class="fas fa-sync-alt"></i> 刷新
                            </button>
                        </div>
                    </div>
                    <div class="songs-grid" id="songsGrid">
                        <!-- 歌曲卡片将在这里动态生成 -->
                    </div>
                </div>

                <!-- 搜索页面 -->
                <div id="search-section" class="section">
                    <div class="section-header">
                        <h2>搜索歌曲</h2>
                    </div>
                    <div class="search-filters">
                        <button class="filter-btn active" data-type="all">全部</button>
                        <button class="filter-btn" data-type="title">标题</button>
                        <button class="filter-btn" data-type="artist">艺术家</button>
                        <button class="filter-btn" data-type="album">专辑</button>
                        <button class="filter-btn" data-type="genre">流派</button>
                        <button class="filter-btn" data-type="language">语言</button>
                    </div>
                    <div class="search-results" id="searchResults">
                        <!-- 搜索结果将在这里显示 -->
                    </div>
                </div>

                <!-- 上传页面 -->
                <div id="upload-section" class="section">
                    <div class="section-header">
                        <h2>上传歌曲</h2>
                    </div>
                    <div class="upload-form">
                        <form id="uploadForm">
                            <div class="form-group">
                                <label for="songFile">音频文件 *</label>
                                <input type="file" id="songFile" name="file" accept="audio/*" required>
                            </div>
                            <div class="form-group">
                                <label for="lyricsFile">歌词文件 (可选)</label>
                                <input type="file" id="lyricsFile" name="lyricsFile" accept=".txt,.lrc,.srt">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="title">歌曲标题 *</label>
                                    <input type="text" id="title" name="title" required>
                                </div>
                                <div class="form-group">
                                    <label for="artist">艺术家</label>
                                    <input type="text" id="artist" name="artist">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="album">专辑</label>
                                    <input type="text" id="album" name="album">
                                </div>
                                <div class="form-group">
                                    <label for="genre">流派</label>
                                    <input type="text" id="genre" name="genre">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="releaseYear">发行年份</label>
                                    <input type="number" id="releaseYear" name="releaseYear" min="1900" max="2030">
                                </div>
                                <div class="form-group">
                                    <label for="durationSeconds">时长(秒)</label>
                                    <input type="number" id="durationSeconds" name="durationSeconds" min="1">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="language">语言</label>
                                <select id="language" name="language">
                                    <option value="">选择语言</option>
                                    <option value="中文">中文</option>
                                    <option value="英文">英文</option>
                                    <option value="日文">日文</option>
                                    <option value="韩文">韩文</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-upload"></i> 上传歌曲
                                </button>
                                <button type="reset" class="btn btn-secondary">
                                    <i class="fas fa-undo"></i> 重置
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 收藏页面 -->
                <div id="favorites-section" class="section">
                    <div class="section-header">
                        <h2>我的收藏</h2>
                    </div>
                    <div class="favorites-grid" id="favoritesGrid">
                        <!-- 收藏的歌曲将在这里显示 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 歌词滚动显示区域，初始隐藏，点击播放器栏弹出 -->
        <div class="lyrics-container collapsed" id="lyricsPanel">
            <div id="lyrics"></div>
        </div>

        <!-- 播放器控制栏 -->
        <div class="player-bar" id="playerBar">
            <div class="player-info">
                <div class="song-cover">
                    <i class="fas fa-music"></i>
                </div>
                <div class="song-details">
                    <div class="song-title" id="currentSongTitle">未选择歌曲</div>
                    <div class="song-artist" id="currentSongArtist">未知艺术家</div>
                </div>
            </div>
            
            <div class="player-controls">
                <button class="control-btn" id="prevBtn">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-btn" id="playBtn">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn" id="nextBtn">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
            
            <div class="player-progress">
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span>/</span>
                    <span id="totalTime">0:00</span>
                </div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                    <input type="range" id="progressSlider" min="0" max="100" value="0">
                </div>
                <div class="volume-control">
                    <i class="fas fa-volume-up"></i>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50">
                </div>
            </div>
        </div>
        <!-- 音频元素 -->
        <audio id="audioPlayer" preload="metadata">
            您的浏览器不支持音频播放。
        </audio>
    </div>

    <!-- 加载提示 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>加载中...</p>
        </div>
    </div>

    <!-- 消息提示 -->
    <div id="messageContainer" class="message-container"></div>

    <script src="./js/api.js"></script>
    <script src="./js/player.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
