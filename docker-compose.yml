version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: music-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: music_system
      MYSQL_USER: music
      MYSQL_PASSWORD: music123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - music-network

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: music-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - music-network

  # 音乐系统应用
  music-app:
    build: .
    container_name: music-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: music
      SPRING_DATASOURCE_PASSWORD: music123
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESSKEY: minioadmin
      MINIO_SECRETKEY: minioadmin
      MINIO_BUCKET: music-files
    depends_on:
      - mysql
      - minio
    networks:
      - music-network

volumes:
  mysql_data:
  minio_data:

networks:
  music-network:
    driver: bridge 