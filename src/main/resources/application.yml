server:
  port: 8080

spring:
  application:
    name: music-system

  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 100ms
    timeout: 3000ms
  
  datasource:
    url: jdbc:mysql://localhost:3306/music_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# MinIO配置
minio:
  endpoint: http://192.168.2.54:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: music-files

# 日志配置
logging:
  level:
    com.music: DEBUG
    org.springframework.web: DEBUG 